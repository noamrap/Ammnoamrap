<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>אליאס טירונות - המהדורה הטקטית</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f1310;
            --panel-bg: #161d18;
            --panel-border: #243027;
            --primary-olive: #4a614d;
            --primary-glow: #5af07b;
            --accent-amber: #ff9f1c;
            --accent-red: #ff4d4d;
            --text-main: #e8eee9;
            --text-muted: #8a9a8e;
            --card-gradient: linear-gradient(135deg, #1c2620 0%, #131a15 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Assistant', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                linear-gradient(rgba(36, 48, 39, 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(36, 48, 39, 0.15) 1px, transparent 1px);
            background-size: 30px 30px;
            pointer-events: none;
            z-index: 0;
        }

        header {
            background: rgba(22, 29, 24, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--panel-border);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 10;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .logo-area h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: linear-gradient(90deg, var(--text-main), var(--primary-glow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-area h1::before {
            content: '🪖';
            font-size: 22px;
        }

        .secret-admin-trigger {
            background: transparent;
            border: 1px solid rgba(138, 154, 142, 0.2);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .secret-admin-trigger:hover {
            border-color: var(--primary-glow);
            color: var(--primary-glow);
            box-shadow: 0 0 10px rgba(90, 240, 123, 0.2);
        }

        main {
            flex: 1;
            display: grid;
            grid-template-columns: 320px 1.5fr;
            gap: 30px;
            padding: 30px;
            max-width: 1600px;
            width: 100%;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        @media (max-width: 900px) {
            main {
                grid-template-columns: 1fr;
            }
        }

        .sidebar {
            background: var(--panel-bg);
            border: 2px solid var(--panel-border);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .sidebar h2 {
            font-size: 18px;
            font-weight: 800;
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: 10px;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        .teams-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .team-row {
            background: var(--card-gradient);
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .team-row::before {
            content: '';
            position: absolute;
            top: 0; right: 0; bottom: 0;
            width: 4px;
            background: transparent;
            transition: background 0.3s;
        }

        .team-row.active-turn {
            border-color: var(--accent-amber);
            box-shadow: 0 0 15px rgba(255, 159, 28, 0.15);
        }
        .team-row.active-turn::before {
            background: var(--accent-amber);
        }

        .team-name {
            font-weight: 600;
            font-size: 16px;
        }

        .team-score-badge {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 15px;
            min-width: 65px;
            text-align: center;
        }

        .team-row.winner-glow {
            border-color: var(--primary-glow);
            animation: pulse-win 2s infinite;
        }
        .team-row.winner-glow .team-score-badge {
            background: var(--primary-glow);
            color: var(--bg-dark);
        }

        .game-arena {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .dashboard-card {
            background: var(--panel-bg);
            border: 2px solid var(--panel-border);
            border-radius: 16px;
            padding: 40px;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            position: relative;
        }

        .setup-screen {
            display: flex;
            flex-direction: column;
            gap: 24px;
            align-items: center;
            max-width: 500px;
            width: 100%;
        }

        .setup-screen h3 {
            font-size: 24px;
            font-weight: 800;
            color: var(--text-main);
        }

        .dropdown-container {
            width: 100%;
            position: relative;
        }

        select {
            width: 100%;
            background: #1c2620;
            border: 2px solid var(--panel-border);
            padding: 16px;
            border-radius: 10px;
            color: var(--text-main);
            font-size: 16px;
            font-weight: 600;
            appearance: none;
            outline: none;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        select:focus {
            border-color: var(--primary-glow);
        }

        .btn {
            background: var(--primary-olive);
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 18px;
            font-weight: 800;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(90, 240, 123, 0.2);
            background: #557059;
        }

        .btn-glow {
            background: var(--primary-glow);
            color: var(--bg-dark);
        }
        .btn-glow:hover {
            background: #73f390;
        }

        .active-game-screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            gap: 30px;
        }

        .turn-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: 15px;
        }

        .current-playing-team {
            font-size: 20px;
            font-weight: 800;
            color: var(--accent-amber);
        }

        .timer-box {
            font-size: 36px;
            font-weight: 900;
            background: rgba(255, 159, 28, 0.1);
            border: 2px solid var(--accent-amber);
            color: var(--accent-amber);
            padding: 10px 24px;
            border-radius: 30px;
            min-width: 100px;
            text-align: center;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(255, 159, 28, 0.1);
        }

        .timer-box.panic {
            background: rgba(255, 77, 77, 0.15);
            border-color: var(--accent-red
